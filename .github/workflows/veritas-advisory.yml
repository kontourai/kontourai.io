name: Veritas Advisory Governance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: readiness / Advisory readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERITAS_OUTPUT_DIR: ${{ github.workspace }}/.kontourai/veritas/execution/github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser evidence dependency
        run: pnpm exec playwright install --with-deps chromium
      - name: Install required command-line evidence tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep
      # validate checks dist/ before test:rendered builds it. The reusable
      # workflow has no build/setup input, so prepare this site's output here.
      - name: Build required site evidence
        run: npm run build
      - name: Resolve exact evidence scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Capture actual Veritas readiness
        uses: kontourai/.github/actions/veritas-readiness@b7de17315e8eb3cffd0695f0b17f3e220ba2c288 # Veritas 1.11.2
        with:
          base-sha: ${{ steps.scope.outputs.base }}
          head-sha: ${{ steps.scope.outputs.head }}
          require-ready: false
      - name: Upload Veritas evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veritas-readiness-${{ github.run_id }}
          path: |
            .kontourai/veritas/evidence/
            ${{ env.VERITAS_OUTPUT_DIR }}
          if-no-files-found: warn
