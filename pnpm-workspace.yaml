# Dependency install scripts are blocked by default (pnpm >= 10). Nothing here
# needs one, so every package that asks is denied by exact version (pnpm fails
# the install on any script it has not been told about).
# esbuild and workerd: each postinstall only version-checks the binary, falls
# back to downloading it when the platform package is missing, and swaps the JS
# shim in bin/ for a hardlink to the native binary. With the scripts skipped,
# the shim still runs the native platform binary: `npm run build`, the rendered
# tests, `wrangler --version` and `wrangler pages dev dist` (which starts
# workerd) all work. Bump these pins together with the dependencies.
allowBuilds:
  esbuild@0.28.1: false
  esbuild@0.28.2: false
  workerd@1.20261019.1: false

# A newly published version must be at least 24 hours old before it can be
# resolved into this lockfile. Blunts the most common supply-chain shape (a
# compromised maintainer publishes and the ecosystem installs within hours).
# pnpm also checks entries already in the lockfile, so a frozen install
# enforces it too.
# First-party @kontourai packages are exempt: they are published from CI with
# npm provenance, and each release is verified before a consumer bumps to it.
# An urgent third-party security patch is opted in explicitly, by name and
# version, with the reason in the commit.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@kontourai/*'

# mise supplies node and pnpm on developer machines; CI installs the exact
# version pinned in package.json. Do not reject a same-major pnpm from mise.
pmOnFail: ignore
